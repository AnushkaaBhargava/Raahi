<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Review</title>
    <style>
        body {
            background-image: url('https://colibriwp.com/blog/wp-content/uploads/2019/06/pawel-czerwinski-vI5XwPbGvmY-unsplash.jpg');
            font-family: Arial, sans-serif;
            background-attachment: fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .review-form-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .review-form {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 24px;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            align-items: center;
            width: 360px;
        }

        .review-form h2 {
            margin-bottom: 24px;
            font-size: 24px;
            text-align: center;
        }

        .review-form label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .review-form input, .review-form textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 5px;
            font-size: 16px;
        }

        .star-rating {
            display: flex;
            justify-content: flex-start;
            width: 100%;
            margin-bottom: 18px;
        }

        .star-rating input[type="radio"] {
            display: none;
        }

        .star-rating label {
            font-size: 30px;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            padding-right: 5px;
            transition: color 0.2s ease-in-out;
        }

        .star-rating input[type="radio"]:checked ~ label {
            color: gold;
        }

        .review-form button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .review-form button:hover {
            background-color: #218838;
        }

        .thank-you-message {
            display: none;
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
            color: #28a745;
        }

        .back-button {
            padding: 10px 20px;
            background-color: #28e5e8e9;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            margin: 20px;
        }

        .back-button:hover {
            background-color: #1e9ab4;
        }
    </style>
</head>
<body>
    <div class="review-form-container">
        <button class="back-button" onclick="window.history.back()">Back</button>
        
        <div class="review-form">
            <h2>Submit Your Review</h2>
           
            <form id="reviewForm" action="#" method="POST">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your Name" required>

                <label for="contact">Contact Number</label>
                <input type="tel" id="contact" name="contact" placeholder="Your Contact Number" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Your Email" required>

                <label for="rating">Rating</label>
                <div class="star-rating">
                    <input type="radio" id="star5" name="rating" value="5" required>
                    <label for="star5">&#9733;</label>
                    <input type="radio" id="star4" name="rating" value="4">
                    <label for="star4">&#9733;</label>
                    <input type="radio" id="star3" name="rating" value="3">
                    <label for="star3">&#9733;</label>
                    <input type="radio" id="star2" name="rating" value="2">
                    <label for="star2">&#9733;</label>
                    <input type="radio" id="star1" name="rating" value="1">
                    <label for="star1">&#9733;</label>
                </div>

                <label for="review">Review</label>
                <textarea id="review" name="review" rows="5" placeholder="Write your review here..." required></textarea>

                <button type="submit">Submit Review</button>
            </form>
            <div class="thank-you-message" id="thankYouMessage">
                Thank you!
            </div>
        </div>
    </div>

    <script>
        const stars = document.querySelectorAll('.star-rating label');
        const starInputs = document.querySelectorAll('.star-rating input[type="radio"]');

        stars.forEach((star, index) => {
            star.addEventListener('click', () => {
                stars.forEach(star => star.style.color = '#ccc');
                for (let i = 0; i <= index; i++) {
                    stars[i].style.color = 'gold';
                }
                starInputs[index].checked = true;
            });
        });

        document.getElementById('reviewForm').addEventListener('submit', function(event) {
            event.preventDefault();
            document.getElementById('thankYouMessage').style.display = 'block';
        });
    </script>

</body>
</html>
